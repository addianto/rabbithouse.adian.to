---
- name: Allow SSH access
  community.general.ufw:
    rule: allow
    port: "{{ firewall_ssh_port }}"
    proto: tcp

- name: Apply custom firewall rules
  community.general.ufw:
    rule: allow
    port: "{{ item.port | default(item) }}"
    proto: "{{ item.proto | default('tcp') }}"
  loop: "{{ firewall_custom_rules }}"
  when: firewall_custom_rules | length > 0

- name: Ensure UFW is enabled and set default incoming policy
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: Ensure UFW is enabled and set default outgoing policy
  community.general.ufw:
    state: enabled
    policy: allow
    direction: outgoing
